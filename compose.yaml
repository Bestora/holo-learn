x-app: &app
    image: holo-learn
    env_file: .env
    restart: unless-stopped
    mem_limit: 256m
    # The FrankenPHP base image ships a healthcheck for its web server; only `app` runs one.
    healthcheck:
        disable: true
    volumes:
        - db:/db
        - storage:/app/storage
        - ./data:/app/data:ro

services:
    app:
        <<: *app
        build:
            context: .
            dockerfile: docker/Dockerfile
        ports:
            - 127.0.0.1:${APP_PORT:-8520}:8080
        healthcheck:
            test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8080/up]
            interval: 30s
            timeout: 5s
            start_period: 60s
            retries: 3

    queue:
        <<: *app
        command: [php, artisan, queue:work, --tries=3, --max-time=3600]
        depends_on:
            app:
                condition: service_healthy

    scheduler:
        <<: *app
        command: [php, artisan, schedule:work]
        depends_on:
            app:
                condition: service_healthy

volumes:
    db:
    storage:
