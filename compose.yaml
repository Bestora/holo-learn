x-app: &app
    image: holo-learn
    # local image built by `app`; never look for it on Docker Hub
    pull_policy: never
    env_file: .env
    restart: unless-stopped
    mem_limit: 256m
    environment:
        TZ: Europe/Berlin
        SCHEDULE_TIMEZONE: Europe/Berlin
    logging:
        driver: json-file
        options:
            max-size: 10m
            max-file: '3'
    # The FrankenPHP base image ships a healthcheck for its web server; only `app` runs one.
    healthcheck:
        disable: true
    volumes:
        - db:/db
        - storage:/app/storage
        - ./data:/app/data:ro

services:
    app:
        <<: *app
        pull_policy: build
        build:
            context: .
            dockerfile: docker/Dockerfile
        ports:
            - 127.0.0.1:${APP_PORT:-8520}:8080
        healthcheck:
            test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8080/up]
            interval: 30s
            timeout: 5s
            start_period: 60s
            retries: 3

    queue:
        <<: *app
        command: [php, artisan, queue:work, --tries=3, --max-time=3600]
        depends_on:
            app:
                condition: service_healthy

    scheduler:
        <<: *app
        command: [php, artisan, schedule:work]
        # also runs holodex:sync and the manual one-off commands
        mem_limit: 384m
        depends_on:
            app:
                condition: service_healthy

volumes:
    db:
    storage:
